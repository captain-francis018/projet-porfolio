services:

  # ─── BASE DE DONNEES ──────────────────────────────
  mongodb:
    image: mongo:7
    container_name: portfolio-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── BACKEND ─────────────────────────────────────
  backend:
    build: ./backend
    container_name: portfolio-api
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/portfolio
      - PORT=5000
      - CORS_ORIGIN=http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - portfolio-net

  # ─── FRONTEND ────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: portfolio-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - portfolio-net
 # ─── Service 4 : SonarQube ─────────────────────────────────────────────────
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - '9000:9000'            # Interface web SonarQube → http://<host>:9000
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    depends_on:
      sonar-db:
        condition: service_healthy
    networks:
      - portfolio-net
    # SonarQube requiert vm.max_map_count ≥ 262144 sur l'hôte
    # Exécuter une seule fois sur le serveur : sudo sysctl -w vm.max_map_count=262144
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ─── Service 5 : Base PostgreSQL pour SonarQube ────────────────────────────
  sonar-db:
    image: postgres:15-alpine
    container_name: sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_postgres:/var/lib/postgresql/data
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


# ─── VOLUMES ──────────────────────────────────────
volumes:
  mongo_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_postgres:

# ─── RESEAU INTERNE ───────────────────────────────
networks:
  portfolio-net:
    driver: bridge

